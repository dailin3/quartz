name: Deploy to Aliyun

on:
  push:
    branches: [v4]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -s -X POST \
            "${{ secrets.WEBHOOK_URL }}?key=${{ secrets.WEBHOOK_SECRET }}" \
            --max-time 180 \
            -w "\nHTTP %{http_code}\n"
